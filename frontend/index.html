<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Personal AI Platform</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #2a2a3a;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.25rem; font-weight: 600; }
        .header .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .status-dot.offline { background: var(--error); }
        .main { flex: 1; display: flex; overflow: hidden; }
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { font-size: 0.875rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
        .session-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .session-item {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-bottom: 0.25rem;
            transition: background 0.2s;
        }
        .session-item:hover { background: var(--border); }
        .session-item.active { background: var(--accent); color: white; }
        .chat-container { flex: 1; display: flex; flex-direction: column; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message { max-width: 80%; padding: 1rem; border-radius: 0.75rem; line-height: 1.5; }
        .message.user { align-self: flex-end; background: var(--accent); color: white; }
        .message.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
        .message.system { align-self: center; background: transparent; color: var(--text-muted); font-size: 0.875rem; }
        .chat-input {
            padding: 1rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        .chat-input textarea {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 1rem;
            resize: none;
            min-height: 44px;
            max-height: 200px;
        }
        .chat-input textarea:focus { outline: none; border-color: var(--accent); }
        .chat-input button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover { background: var(--accent-hover); }
        .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing { display: flex; gap: 4px; padding: 0.5rem; }
        .typing span { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>JARVIS</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Sessions</h2>
                <button onclick="newSession()" style="width:100%;padding:0.5rem;background:var(--accent);color:white;border:none;border-radius:0.25rem;cursor:pointer;">+ New Chat</button>
            </div>
            <div class="session-list" id="sessionList"></div>
        </div>
        <div class="chat-container">
            <div class="chat-messages" id="messages"></div>
            <div class="chat-input">
                <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    <script>
        let ws = null;
        let currentSession = 'default';
        let sessions = {};

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat/${currentSession}`);

            ws.onopen = () => {
                document.getElementById('statusDot').classList.remove('offline');
                document.getElementById('statusText').textContent = 'Connected';
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.add('offline');
                document.getElementById('statusText').textContent = 'Disconnected';
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'token') {
                    appendToken(data.content);
                } else if (data.type === 'done') {
                    finishMessage();
                } else if (data.type === 'error') {
                    appendMessage('system', data.content);
                }
            };
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            document.getElementById('messages').appendChild(div);
            scrollToBottom();
        }

        function appendToken(token) {
            let last = document.querySelector('.message.assistant:last-child');
            if (!last || last.dataset.streaming !== 'true') {
                last = document.createElement('div');
                last.className = 'message assistant';
                last.dataset.streaming = 'true';
                document.getElementById('messages').appendChild(last);
            }
            last.textContent += token;
            scrollToBottom();
        }

        function finishMessage() {
            const last = document.querySelector('.message.assistant:last-child');
            if (last) last.dataset.streaming = 'false';
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            appendMessage('user', text);
            ws.send(JSON.stringify({ type: 'chat', content: text }));
            input.value = '';
            input.style.height = 'auto';
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function newSession() {
            currentSession = 'session-' + Date.now();
            sessions[currentSession] = [];
            updateSessionList();
            document.getElementById('messages').innerHTML = '';
            if (ws) ws.close();
            connect();
        }

        function updateSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = Object.keys(sessions).map(id =>
                `<div class="session-item ${id === currentSession ? 'active' : ''}" onclick="switchSession('${id}')">${id}</div>`
            ).join('');
        }

        function switchSession(id) {
            currentSession = id;
            if (ws) ws.close();
            connect();
            updateSessionList();
        }

        // Initialize
        sessions[currentSession] = [];
        updateSessionList();
        connect();
    </script>
</body>
</html>
