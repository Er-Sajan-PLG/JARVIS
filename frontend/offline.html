<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>JARVIS — Offline</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    color: #e6e6e6;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 22rem; text-align: center; }
  .orb {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid rgba(0, 191, 255, 0.45);
    background: radial-gradient(circle at 50% 40%, rgba(0, 191, 255, 0.35), transparent 70%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 10px;
    color: #00bfff;
  }
  p { margin: 0 0 22px; line-height: 1.6; color: #9aa4ad; font-size: 0.92rem; }
  button {
    width: 100%;
    min-height: 44px; /* comfortable phone touch target */
    padding: 12px 20px;
    border: 1px solid rgba(0, 191, 255, 0.4);
    border-radius: 10px;
    background: rgba(0, 191, 255, 0.12);
    color: #00bfff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: rgba(0, 191, 255, 0.25); }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>Offline</h1>
  <p>
    JARVIS is unreachable. The host machine may be asleep, or your phone may be
    off the private network. Reconnect and try again.
  </p>
  <button type="button" onclick="location.reload()">Retry</button>
</main>
<script>
  // Recover on its own when connectivity returns, so the user is not left
  // staring at a dead page after walking back into Wi-Fi range.
  window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
