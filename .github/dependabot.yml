# JARVIS Dependabot configuration
# docs: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates
version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    labels: ["deps", "automerge"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      testing:
        patterns: ["pytest*", "pytest-*", "hypothesis", "faker"]
      linting:
        patterns: ["ruff", "mypy", "pyright"]

    # NOTE: `ignore` is a SIBLING of `groups`, not a child of it. Until
    # 2026-10-21 this block was indented under `groups`, which made it a no-op —
    # Dependabot does not read an `ignore` key nested inside `groups`, so the
    # chromadb entry below had never suppressed anything.
    ignore:
      # ChromaDB: the pre-auth CVEs require an exposed HTTP server. JARVIS only
      # ever uses PersistentClient (local-only), so they are not reachable.
      # See: https://github.com/Er-Sajan-PLG/JARVIS/security/dependabot
      - dependency-name: "chromadb"

      # CUDA runtime libraries. These are transitive to torch's `cuda-toolkit`
      # extra, NOT direct dependencies, so raising one alone is unresolvable by
      # construction:
      #   ERROR: Cannot install -r requirements.txt (line 217) and nvidia-nvshmem-cu13==3.8.0
      #   ERROR: ResolutionImpossible
      # They move when torch moves. PRs #132 and #126 were closed for this reason.
      - dependency-name: "nvidia-*"

  # npm dependencies (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 5
    labels: ["deps", "frontend"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci", "deps"]
