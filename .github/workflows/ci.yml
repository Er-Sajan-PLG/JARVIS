name: "JARVIS-CI"

# DISABLED (2026-09-10): GitHub Actions is unusable for this private repo — the
# account is billing-blocked and every run dies in ~5s ("The job was not started
# because recent account payments have failed or your spending limit needs to be
# increased"), which turned every PR red without running a single check.
#
# CI now runs locally: n8n (jarvis-n8n.service) polls every 30 minutes and drives
# scripts/ci_bridge.py -> scripts/ci_gate.py, which enforces strictly MORE than
# this workflow did (22 checks incl. SAST, SCA, SBOM, provenance, licences).
# See docs/CI-GATE-SOTA.md.
#
# To restore Actions, re-add the triggers:
#   pull_request:
#     types: [opened, synchronize, reopened]
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  lint-and-typecheck:
    name: "Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ratchet diff needs the base ref
      - uses: ./.github/actions/setup-env
      # Ratchet lint: enforce ruff on CHANGED files only. The full tree carries
      # pre-existing debt (RISK-005 in docs/ACCEPTED_RISKS.md); enforcing it
      # repo-wide fails at HEAD and blocks every PR. New/changed code must be
      # clean while the legacy backlog is burned down per sprint.
      - name: Run ruff (changed files, ratchet)
        run: scripts/lint_changed.sh
      # mypy strict is not yet enforced repo-wide (591 legacy errors). Reported
      # but non-blocking until the type backlog clears — see RISK-005.
      - name: Run mypy (strict, non-blocking)
        continue-on-error: true
        run: .venv/bin/mypy --strict app/

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run pytest with coverage
        run: .venv/bin/pytest tests/ -v --cov=app --cov-fail-under=80 --cov-report=term-missing

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/src --no-git --verbose --redact
      - name: Run bandit SAST
        run: |
          .venv/bin/bandit -r app/ -c pyproject.toml -f json -o bandit-results.json || true
      - name: Run pip-audit
        run: |
          .venv/bin/pip-audit -r requirements.txt -f json -o pip-audit-results.json || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.json
          category: bandit

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Python compileall (syntax check)
        run: .venv/bin/python -m compileall app/
      - name: Build Docker image
        run: docker build -t jarvis:${{ github.sha }} .

  commitlint:
    name: "Conventional Commits"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  governance:
    name: "Virtual Board Governance"
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security, build, commitlint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run governance checks
        run: .venv/bin/python scripts/board/review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
