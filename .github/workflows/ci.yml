name: "JARVIS-CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  lint-and-typecheck:
    name: "Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run ruff (lint)
        run: .venv/bin/ruff check app/ tests/
      - name: Run ruff (format check)
        run: .venv/bin/ruff format --check app/ tests/
      - name: Run mypy (strict)
        run: .venv/bin/mypy --strict app/

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run pytest with coverage
        run: .venv/bin/pytest tests/ -v --cov=app --cov-fail-under=80 --cov-report=term-missing

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/src --no-git --verbose --redact
      - name: Run bandit SAST
        run: |
          .venv/bin/pip install bandit==1.8.3
          .venv/bin/bandit -r app/ -c pyproject.toml -f json -o bandit-results.json || true
      - name: Run pip-audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit -r requirements.txt -f json -o pip-audit-results.json || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.json
          category: bandit

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Python compileall (syntax check)
        run: .venv/bin/python -m compileall app/
      - name: Build Docker image
        run: docker build -t jarvis:${{ github.sha }} .

  commitlint:
    name: "Conventional Commits"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  governance:
    name: "Virtual Board Governance"
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security, build, commitlint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run governance checks
        run: .venv/bin/python scripts/board/review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}