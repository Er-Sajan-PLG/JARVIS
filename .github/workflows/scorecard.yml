name: OpenSSF Scorecard

# Publishes a public, quantified answer to "is this repository hardened?" — branch
# protection, token permissions, pinned dependencies, dangerous workflow patterns,
# signed releases, and whether the project is actively maintained. It is the artifact an
# auditor asks for, and it is produced by a third party rather than self-reported.
#
# Additive and non-gating, for the same reason as CodeQL: `ci-gate` is the one required
# check, and this reports to the Security tab instead of gating a merge.

on:
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1'
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload the SARIF result to the code-scanning tab.
      security-events: write
      # publish_results signs the result with this OIDC token; without it the run can
      # only report locally and the public scorecard is never updated.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        # ossf/scorecard-action publishes no floating `v2` tag — only exact versions —
        # so this is pinned to v2.4.4's commit.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to the code-scanning tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
