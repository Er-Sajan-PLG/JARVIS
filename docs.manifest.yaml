# Doc-to-code manifest (autonomous docs system v1).
# Every human-readable doc is classified exactly once. Sections with empty
# covers justify themselves in notes. Generated sections name their generator;
# check-full.py diffs regenerated output against committed blocks.

version: 1
sections:
  # Root docs.
  - doc: README.md
    covers: [app/main.py, app/bootstrap.py]
    kind: hand
    staleness: content
    owner: platform
  - doc: AGENTS.md
    covers: [githooks/, scripts/board/review.py, scripts/ci_gate.py]
    kind: hand
    staleness: semantic
    owner: governance
  - doc: CONTRIBUTING.md
    covers: [.pre-commit-config.yaml, githooks/, .github/workflows/]
    kind: hand
    staleness: content
    owner: governance
  - doc: CODE_OF_CONDUCT.md
    covers: []
    kind: hand
    staleness: semantic
    owner: governance
    notes: Covenant policy; no code mapping by design.
  - doc: SECURITY.md
    covers: [.github/dependabot.yml]
    kind: hand
    staleness: semantic
    owner: security
  - doc: DEVLOG.md
    covers: []
    kind: hand
    staleness: snapshot
    owner: platform
    notes: Append-only dev log; entries are point-in-time facts.
  - doc: DOCS_AUDIT_REPORT.md
    covers: []
    kind: hand
    staleness: snapshot
    owner: docs-system
    notes: Phase 1 point-in-time audit; superseded by design + logs, never edited in place.
