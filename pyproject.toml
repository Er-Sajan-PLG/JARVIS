[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "3.0.1"
description = "JARVIS Personal AI Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# `legacy/` is an archive, not code: it contains `legacy/app/api/...`, which makes
# mypy see a SECOND directory claiming to be the `app` package. Without this line,
# any run that reaches app/ aborts with "Duplicate module named app" and reports
# NOTHING about the real package — a gate that cannot run is worse than one that
# fails loudly, because silence reads as success.
#
# With the exclusion, mypy checks app/ and reports the genuine, pre-existing
# strict-mode debt (RISK-005). That debt is not fixed here; it is now *visible*.
exclude = ['^legacy/']
