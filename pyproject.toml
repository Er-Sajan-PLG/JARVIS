[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "3.0.1"
description = "JARVIS Personal AI Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# ``--strict-markers``: an undeclared marker is an ERROR, not a typo that is
# silently accepted. Without it ``@pytest.mark.asincio`` selects nothing and
# ``-m asyncio`` silently matches nothing, so a mis-spelled marker reads as
# "no tests to run" instead of "you are wrong".
addopts = "-v --tb=short --strict-markers"
# Every marker this suite uses. One is not pytest core (``asyncio``, registered by
# pytest-asyncio); the rest are pytest core builtins, pinned here so this list is
# a complete inventory of the marker vocabulary the suite is allowed to use and a
# typo'd name is rejected rather than silently selecting nothing.
markers = [
    "asyncio: an async test, driven by pytest-asyncio (asyncio_mode = auto).",
    "parametrize: pytest core builtin — run one test over several inputs.",
    "skipif: pytest core builtin — a conditional skip with a stated condition.",
    "xfail: pytest core builtin — a known failure that must keep failing.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# `legacy/` is an archive, not code: it contains `legacy/app/api/...`, which makes
# mypy see a SECOND directory claiming to be the `app` package. Without this line,
# any run that reaches app/ aborts with "Duplicate module named app" and reports
# NOTHING about the real package — a gate that cannot run is worse than one that
# fails loudly, because silence reads as success.
#
# With the exclusion, mypy checks app/ and reports the genuine, pre-existing
# strict-mode debt (RISK-005). That debt is not fixed here; it is now *visible*.
exclude = ['^legacy/']
