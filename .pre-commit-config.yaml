# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements

  # NOTE: the previous repo (github.com/alphanodes/commitlint) was deleted from
  # GitHub (404), which broke `pre-commit` entirely — every hook install failed
  # before any hook ran. Switched to the maintained hook below.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Scope to STAGED files. `args: [--strict, app/]` made pre-commit run a
        # full strict scan of app/ on any commit touching one .py file, which
        # can never pass (465+ pre-existing errors) -- so every Python commit
        # was blocked and people reached for --no-verify. The repo-wide ceiling
        # is enforced by gate_mypy against .governance/mypy_baseline.txt instead.
        # --ignore-missing-imports: this hook's isolated venv has no project deps
        # (uvicorn etc.), so without it every file reports phantom import errors.
        args: [--strict, --ignore-missing-imports]
        additional_dependencies: [types-requests]
