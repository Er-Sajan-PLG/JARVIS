# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        # Scope to active source only — never touch tests/, legacy/, or external/.
        # The repo-wide lint ceiling is enforced by CI gate_ruff_ratchet, not pre-commit.
        # Limiting scope prevents the hook from reformatting vendored code or files
        # outside the project's active development surface.
        files: ^(app|scripts|evals)/.*\.py$
      - id: ruff-format
        files: ^(app|scripts|evals)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(app|scripts|evals|docs)/.*\.(py|md|yaml|yml|json|toml)$
      - id: end-of-file-fixer
        files: ^(app|scripts|evals|docs)/.*\.(py|md|yaml|yml|json|toml)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
        files: ^(app|scripts|evals)/.*\.py$

  # NOTE: the previous repo (github.com/alphanodes/commitlint) was deleted from
  # GitHub (404), which broke `pre-commit` entirely — every hook install failed
  # before any hook ran. Switched to the maintained hook below.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Scope to STAGED files in app/ and scripts/ only (not their transitive
        # imports, not tests/). The repo-wide ceiling is enforced by gate_mypy
        # against .governance/mypy_baseline.txt in CI; this hook catches NEW
        # strict-mode errors in the exact files a commit touches.
        #   --follow-imports=skip  : don't pull app/tools, app/memory, ... debt in
        #   --ignore-missing-imports : hook venv lacks project deps (uvicorn, yaml)
        #   --disable-error-code=misc: FastAPI's @app.* decorators are untyped to
        #     mypy, producing "Untyped decorator makes fn untyped" false positives
        #     that are not real defects.
        files: ^(app|scripts)/.*\.py$
        exclude: ^tests/
        args:
          - --strict
          - --ignore-missing-imports
          - --follow-imports=skip
          - --disable-error-code=misc
        additional_dependencies: [types-requests]

  # Secret scanning — block commits that contain secrets/credentials (SUP-007).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
