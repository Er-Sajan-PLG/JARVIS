# Model configuration only needs a model registry. Profiles are no longer used.
# The runtime builds:
#   - default local Ollama router from the smallest configured Ollama model
#   - omni router using every loaded client across providers
#
# Optional API keys go into .env for cloud providers:
#   OPENROUTER_API_KEY, XAI_API_KEY, GOOGLE_API_KEY

models:
  # --- 🟢 LOCAL ---
  local_general:
    name: "qwen3-8b.gguf"
    role: "general"
    backend: "llamacpp"
    base_url: "http://localhost:8080/v1"


  # --- 🟠 GROK (XAI) ---
  grok:
    name: "grok-3-beta"
    role: "general"
    backend: "llamacpp"
    base_url: "https://api.x.ai/v1"
    api_key: "env:XAI_API_KEY"


  # --- 🔵 OPENROUTER ---
 
  openrouter:
    name: "qwen/qwen3-coder:free"
    role: "code"
    backend: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "env:OPENROUTER_API_KEY"

 

  # --- 🟡 GOOGLE (backend: "google" -> app/models/google_client.py) ---
  google_general:
    name: "gemini-2.0-flash"
    role: "general"
    backend: "google"
    api_key: "env:GOOGLE_API_KEY"
